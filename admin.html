<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Версия кода. Читается из САМОЙ страницы: служебный работник (sw.js)
       подменяет адреса файлов, и версию из адреса модуля брать нельзя —
       оттуда приходит имя кэша, а не версия сборки. -->
  <meta name="gm-build" content="20261030k" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Мой Склад</title>
  <link rel="manifest" href="manifest.webmanifest?v=20261030k" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Склад" />
  <link rel="icon" href="icon.svg?v=20261030k" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png?v=20261030k" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <!-- Тема ставится до отрисовки, иначе страница мигнёт чужим цветом.
       Повторяет initTheme() из js/effects.js — менять их нужно вместе. -->
  <script>try{if(!localStorage.getItem("sklad_theme_v3")){localStorage.setItem("sklad_theme","light");localStorage.setItem("sklad_theme_v2","1");localStorage.setItem("sklad_theme_v3","1");}}catch(e){}document.documentElement.setAttribute("data-theme", localStorage.getItem("sklad_theme") || "light");</script>
  <link rel="stylesheet" href="css/theme.css?v=20261030k" />
</head>
<body>
  <button class="btn btn-outline btn-icon menu-btn" id="menuBtn"
    style="position:fixed;top:14px;left:14px;z-index:160" onclick="document.querySelector('.sidebar')?.classList.toggle('open')">☰</button>
  <div id="root">
    <div class="login-wrap"><div class="login-card">
      <svg width="116" height="116" viewBox="0 0 512 512" style="margin-bottom:10px" role="img" aria-label="GENERAL MODERN">
        <defs>
          <linearGradient id="ast" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f2f4f9"/><stop offset="1" stop-color="#e4e9f2"/></linearGradient>
          <linearGradient id="azl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e9a6"/><stop offset=".42" stop-color="#e3c163"/><stop offset=".74" stop-color="#c79a33"/><stop offset="1" stop-color="#a87b1f"/></linearGradient>
          <style>
            @keyframes apop{0%{transform:scale(.6);opacity:0}62%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
            @keyframes aturn{100%{transform:rotate(360deg)}}
            @keyframes alet{0%{opacity:0;transform:translateY(20px) scale(.9)}100%{opacity:1;transform:none}}
            #aznak{animation:apop .62s cubic-bezier(.2,.85,.25,1) both;transform-box:fill-box;transform-origin:center}
            #aring{stroke-dasharray:1062 1144;animation:aturn 2.6s linear infinite;transform-box:fill-box;transform-origin:center}
            #agm{animation:alet .55s ease .4s both;transform-box:fill-box;transform-origin:center}
            @media (prefers-reduced-motion:reduce){#aznak,#aring,#agm{animation:none}}
          </style>
        </defs>
        <g id="aznak">
          <rect width="512" height="512" rx="116" fill="url(#ast)"/>
          <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#c8cedd" stroke-width="5"/>
          <circle id="aring" cx="256" cy="256" r="182" fill="none" stroke="url(#azl)" stroke-width="14" stroke-linecap="round" transform="rotate(-96 256 256)"/>
          <text id="agm" x="256" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="700" letter-spacing="-6" fill="#16203a">GM</text>
        </g>
      </svg>
      <p>Загрузка…</p></div></div>
  </div>
  <script src="config.js?v=20261030k"></script>
  <script type="module" src="js/app.js?v=20261030k"></script>
</body>
</html>
