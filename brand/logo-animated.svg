<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="anv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22324f"/><stop offset="1" stop-color="#141f33"/></linearGradient>
    <linearGradient id="agd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e9a6"/><stop offset=".45" stop-color="#e3c163"/><stop offset=".75" stop-color="#c79a33"/><stop offset="1" stop-color="#a87b1f"/></linearGradient>
    <linearGradient id="ashine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="abadge"><rect width="512" height="512" rx="116"/></clipPath>
    <style>
      @keyframes gmpop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes gmdraw{0%{stroke-dashoffset:1098}100%{stroke-dashoffset:0}}
      @keyframes gmletters{0%{opacity:0;transform:translateY(22px) scale(.88)}100%{opacity:1;transform:none}}
      @keyframes gmsweep{0%{transform:translateX(-540px) rotate(18deg)}100%{transform:translateX(540px) rotate(18deg)}}
      .a-badge{animation:gmpop .7s cubic-bezier(.2,.85,.25,1) both;transform-box:fill-box;transform-origin:center}
      .a-ring{stroke-dasharray:1062 1144;animation:gmdraw 1.1s ease .25s both}
      .a-gm{animation:gmletters .6s ease .55s both;transform-box:fill-box;transform-origin:center}
      .a-shine{animation:gmsweep 2.8s ease-in-out 1.3s infinite}
    </style>
  </defs>

  <g class="a-badge">
    <rect width="512" height="512" rx="116" fill="url(#anv)"/>
    <circle class="a-ring" cx="256" cy="256" r="182" fill="none" stroke="url(#agd)" stroke-width="10" stroke-linecap="round" transform="rotate(-96 256 256)"/>
    <text class="a-gm" x="256" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="700" letter-spacing="-6" fill="url(#agd)">GM</text>
    <g clip-path="url(#abadge)"><rect class="a-shine" x="226" y="-130" width="60" height="772" fill="url(#ashine)"/></g>
  </g>
</svg>
