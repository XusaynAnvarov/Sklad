# Защитные заголовки сайта. Подключается через include в каждом location,
# где есть свой add_header: в nginx add_header внутри location отменяет
# заголовки уровня server, поэтому одного включения наверху мало.
# Те же заголовки ставит и server.js — для страниц, которые отдаёт Node.
#
#  nosniff            — браузер не «угадывает» тип файла (картинка не станет скриптом)
#  Referrer-Policy    — в чужие сайты уходит только домен, без пути и параметров
#  frame-ancestors    — встроить сайт в чужую страницу нельзя (защита от подложных
#                       кнопок поверх настоящих); Telegram разрешён — мини-приложение
#  HSTS               — браузер ходит только по https (поддомены не затрагиваются)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
add_header Strict-Transport-Security "max-age=15552000" always;
# CSP в режиме наблюдения — только отчёты на /api/csp-report, ничего не блокирует.
# Строка совпадает с api/lib/csp.js (проверяет _tools/tests/t-csp.mjs).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://telegram.org https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh https://open.er-api.com https://*.google-analytics.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-src 'self' https://t.me https://telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
