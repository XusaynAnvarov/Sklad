# ========================================================================
#  НАСТРОЙКА NGINX ДЛЯ generalmodern.uz
#
#  Живёт на сервере: /etc/nginx/sites-available/generalmodern.uz
#  (и ссылка на неё в /etc/nginx/sites-enabled/).
#
#  Копия лежит здесь намеренно: раньше этот файл существовал ТОЛЬКО на
#  сервере, поэтому ни один разбор поломки не мог до него добраться — а
#  корень двух долгих поломок был именно тут.
#
#  Применить:
#    scp deploy/nginx-generalmodern.conf root@СЕРВЕР:/tmp/gm.conf
#    ssh root@СЕРВЕР 'cp /etc/nginx/sites-available/generalmodern.uz \
#        /etc/nginx/sites-available/generalmodern.uz.bak.$(date +%F-%H%M) && \
#        cp /tmp/gm.conf /etc/nginx/sites-available/generalmodern.uz && \
#        nginx -t && systemctl reload nginx'
# ========================================================================

server {
    server_name generalmodern.uz www.generalmodern.uz;

    root /var/www/skladanvarov;
    index index.html;

    # ------------------------------------------------------------------
    #  СЛУЖЕБНЫЕ ФАЙЛЫ НАРУЖУ НЕ ОТДАЁМ.
    #  До этой правки скачивались кем угодно: /server.js, /api/bot.js,
    #  /.git/config и — самое опасное — /data/admin-creds.json с логином и
    #  хэшем пароля от склада. Виновато правило «отдавать всё, что кончается
    #  на .js»: оно ловило и серверный код тоже.
    # ------------------------------------------------------------------
    location ~ ^/(\.git|data|db|scripts|_tools|node_modules|\.github)/ { deny all; }
    location ~ /\.env                { deny all; }
    location = /server.js            { deny all; }
    location = /package.json         { deny all; }
    location = /package-lock.json    { deny all; }

    # ------------------------------------------------------------------
    #  API — приложение на Node.js.
    #  Префикс ^~ обязателен: без него правило по расширению (ниже)
    #  перехватывает адреса вроде /api/img?...=фото.jpg и ищет файл на
    #  диске, не доходя до приложения. Именно на это ушли две выкладки.
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    #  Service worker. По нему приложение узнаёт, не устарело ли открытое
    #  в браузере. Кэшировать его нельзя — иначе проверка смотрит на
    #  вчерашнее и молчит.
    # ------------------------------------------------------------------
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Код и картинки: в адресе есть ?v=, при выкладке он меняется —
    # значит держать в кэше можно долго.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webmanifest|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    #  СТРАНИЦЫ НЕ КЭШИРУЕМ.
    #  Без этого заголовка браузер решает сам и держит страницу часами:
    #  выкладка проходит, а на экране вчерашнее — внутри страницы записаны
    #  адреса старого кода. Из-за этого дважды «пропадали» новые разделы
    #  в телефоне и фотографии товаров на сайте.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/generalmodern.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/generalmodern.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = generalmodern.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name generalmodern.uz www.generalmodern.uz;
    return 404; # managed by Certbot


}
