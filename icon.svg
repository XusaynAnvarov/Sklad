<!-- Знак GENERAL MODERN — «стеклянная печать».
     Светлая перламутровая плитка, золотое кольцо из двух дуг (разрыв даёт
     ощущение движения) и монограмма чернилами. Шрифт — обычный гротеск из
     системы: иконку рисует устройство, и своего шрифта у неё нет. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GENERAL MODERN">
  <defs>
    <linearGradient id="gmSteklo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f2f4f9"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="gmZoloto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9a6"/>
      <stop offset=".42" stop-color="#e3c163"/>
      <stop offset=".74" stop-color="#c79a33"/>
      <stop offset="1" stop-color="#a87b1f"/>
    </linearGradient>
    <linearGradient id="gmBlik" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gmPlitka">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#gmSteklo)"/>

  <!-- косой блик — то, от чего плитка читается как стекло -->
  <g clip-path="url(#gmPlitka)">
    <path d="M-120 300 L300 -120 L430 10 L10 430 Z" fill="url(#gmBlik)"/>
  </g>

  <!-- кромка: светлая снаружи, чтобы знак не сливался с белым фоном -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#c8cedd" stroke-width="5"/>

  <!-- золотое кольцо из двух дуг -->
  <g fill="none" stroke="url(#gmZoloto)" stroke-width="14" stroke-linecap="round">
    <path d="M256 74a182 182 0 0 1 182 182"/>
    <path d="M256 438A182 182 0 0 1 74 256"/>
  </g>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#000" stroke-opacity=".05" stroke-width="2"/>

  <text x="256" y="314" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="166" font-weight="800" letter-spacing="-8" fill="#16203a">GM</text>
</svg>
