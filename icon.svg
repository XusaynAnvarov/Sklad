<!-- Знак GENERAL MODERN — тёмно-синяя плитка, золотое кольцо, монограмма. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GENERAL MODERN">
  <defs>
    <linearGradient id="gmFon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="1" stop-color="#141f33"/>
    </linearGradient>
    <linearGradient id="gmZoloto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9a6"/>
      <stop offset=".42" stop-color="#e3c163"/>
      <stop offset=".74" stop-color="#c79a33"/>
      <stop offset="1" stop-color="#a87b1f"/>
    </linearGradient>
    <linearGradient id="gmBlik" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gmPlitka">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#gmFon)"/>

  <!-- золотое кольцо — почти полное, небольшой разрыв снизу -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#gmZoloto)"
          stroke-width="10" stroke-linecap="round" stroke-dasharray="1062 1144"/>

  <text x="256" y="312" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="172" font-weight="700" letter-spacing="-6" fill="url(#gmZoloto)">GM</text>

  <!-- тонкий блик -->
  <g clip-path="url(#gmPlitka)">
    <rect x="196" y="-130" width="60" height="772" fill="url(#gmBlik)"/>
  </g>
</svg>
