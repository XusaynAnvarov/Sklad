<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Версия кода. Читается из САМОЙ страницы: служебный работник (sw.js)
       подменяет адреса файлов, и версию из адреса модуля брать нельзя —
       оттуда приходит имя кэша, а не версия сборки. -->
  <meta name="gm-build" content="20261030c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>General Modern — оптовые поставки</title>
  <meta name="description" content="General Modern — профессиональный B2B каталог товаров. Оформляйте заказы онлайн." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#eef1f7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GENERAL MODERN" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/site.css?v=20261030c" />
</head>
<body>

<!-- Загрузка: стеклянная плитка со знаком, золотое кольцо чертится по кругу,
     по плитке проходит блик. Светлый фон — как и весь сайт. -->
<div id="gm-loader">
  <div class="gm-loader-glow" aria-hidden="true"></div>
  <div class="gm-loader-card">
    <svg width="104" height="104" viewBox="0 0 512 512" role="img" aria-label="GENERAL MODERN">
      <defs>
        <linearGradient id="lst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f2f4f9"/><stop offset="1" stop-color="#e4e9f2"/></linearGradient>
        <linearGradient id="lzl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e9a6"/><stop offset=".42" stop-color="#e3c163"/><stop offset=".74" stop-color="#c79a33"/><stop offset="1" stop-color="#a87b1f"/></linearGradient>
        <style>
          @keyframes lpop{0%{transform:scale(.6);opacity:0}62%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
          @keyframes ldraw{0%{stroke-dashoffset:1144}100%{stroke-dashoffset:0}}
          @keyframes lturn{100%{transform:rotate(360deg)}}
          @keyframes llet{0%{opacity:0;transform:translateY(20px) scale(.9)}100%{opacity:1;transform:none}}
          #lznak{animation:lpop .62s cubic-bezier(.2,.85,.25,1) both;transform-box:fill-box;transform-origin:center}
          #lkoltso{stroke-dasharray:1062 1144;animation:ldraw 1.1s ease .2s both,lturn 2.6s linear 1.3s infinite;transform-box:fill-box;transform-origin:center}
          #lgm{animation:llet .55s ease .55s both;transform-box:fill-box;transform-origin:center}
          @media (prefers-reduced-motion:reduce){#lznak,#lkoltso,#lgm{animation:none}}
        </style>
      </defs>
      <g id="lznak">
        <rect width="512" height="512" rx="116" fill="url(#lst)"/>
        <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#c8cedd" stroke-width="5"/>
        <circle id="lkoltso" cx="256" cy="256" r="182" fill="none" stroke="url(#lzl)" stroke-width="14" stroke-linecap="round" transform="rotate(-96 256 256)"/>
        <text id="lgm" x="256" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="700" letter-spacing="-6" fill="#16203a">GM</text>
      </g>
    </svg>
    <span class="loader-text">General Modern</span>
    <span class="loader-progress" aria-hidden="true"></span>
  </div>
</div>

<!-- Приложение -->
<div id="site-app"></div>

<script type="module">
  import { boot } from "./js/site/app.js?v=20261030c";
  boot();
</script>
</body>
</html>
