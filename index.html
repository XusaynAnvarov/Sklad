<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>General Modern — оптовые поставки</title>
  <meta name="description" content="General Modern — профессиональный B2B каталог товаров. Оформляйте заказы онлайн." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GENERAL MODERN" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/site.css?v=20260820d" />
</head>
<body>

<!-- GM Loader — анимированный логотип при загрузке -->
<div id="gm-loader">
  <svg width="96" height="96" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="lnv" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#22324f"/>
        <stop offset="1" stop-color="#141f33"/>
      </linearGradient>
      <linearGradient id="lgd" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7e9a6"/>
        <stop offset=".45" stop-color="#e3c163"/>
        <stop offset=".75" stop-color="#c79a33"/>
        <stop offset="1" stop-color="#a87b1f"/>
      </linearGradient>
      <linearGradient id="lsh" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="lcb"><rect width="512" height="512" rx="116"/></clipPath>
      <style>
        @keyframes lpop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
        @keyframes ldraw{0%{stroke-dashoffset:1098}100%{stroke-dashoffset:0}}
        @keyframes llet{0%{opacity:0;transform:translateY(22px) scale(.88)}100%{opacity:1;transform:none}}
        @keyframes lsweep{0%{transform:translateX(-540px) rotate(18deg)}100%{transform:translateX(540px) rotate(18deg)}}
        #lbadge{animation:lpop .7s cubic-bezier(.2,.85,.25,1) both;transform-box:fill-box;transform-origin:center}
        #lring{stroke-dasharray:1062 1144;animation:ldraw 1.1s ease .25s both}
        #lgm{animation:llet .6s ease .55s both;transform-box:fill-box;transform-origin:center}
        #lshine{animation:lsweep 2.8s ease-in-out 1.3s infinite}
      </style>
    </defs>
    <g id="lbadge">
      <rect width="512" height="512" rx="116" fill="url(#lnv)"/>
      <circle id="lring" cx="256" cy="256" r="182" fill="none" stroke="url(#lgd)" stroke-width="10" stroke-linecap="round" transform="rotate(-96 256 256)"/>
      <text id="lgm" x="256" y="312" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="172" font-weight="700" letter-spacing="-6" fill="url(#lgd)">GM</text>
      <g clip-path="url(#lcb)"><rect id="lshine" x="226" y="-130" width="60" height="772" fill="url(#lsh)"/></g>
    </g>
  </svg>
  <span class="loader-text">General Modern</span>
</div>

<!-- Приложение -->
<div id="site-app"></div>

<script type="module">
  import { boot } from "./js/site/app.js?v=20260820d";
  boot();
</script>
</body>
</html>
