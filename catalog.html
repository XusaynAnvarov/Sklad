<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Версия кода. Читается из САМОЙ страницы: служебный работник (sw.js)
       подменяет адреса файлов, и версию из адреса модуля брать нельзя —
       оттуда приходит имя кэша, а не версия сборки. -->
  <meta name="gm-build" content="20261030a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Каталог товаров</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f5f6f8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <script>try{if(!localStorage.getItem("sklad_theme_v2")){localStorage.setItem("sklad_theme","dark");localStorage.setItem("sklad_theme_v2","1");}}catch(e){}document.documentElement.setAttribute("data-theme", localStorage.getItem("sklad_theme") || "dark");</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/theme.css?v=20261030a" />
  <style>
    .cat-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap;max-width:1200px;margin:0 auto;}
    .cat-topbar .lang-switch{margin:0;width:auto;}
    .cat-topbar .theme-toggle{margin:0;width:auto;padding:8px 14px;}
    .cat-header{text-align:center;padding:14px 20px 8px;}
    .cat-header .badge-top{display:inline-block;padding:6px 14px;border-radius:30px;font-size:12px;margin-bottom:10px;
      background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.5);color:var(--accent3);}
    .cat-header h1{font-size:clamp(24px,5vw,38px);font-weight:800;line-height:1.1;}
    .cat-header h1 span{background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .cat-header p{color:var(--muted);max-width:560px;margin:8px auto 0;font-size:14px;}
    /* липкая панель сверху: кнопка PDF + лента категорий */
    .cat-controls{position:sticky;top:0;z-index:40;margin:0;padding:10px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;
      background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
    .cat-actions{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;max-width:680px;}
    .cat-search{flex:1;max-width:460px;}
    .cat-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px;}
    .cat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;
      text-decoration:none;color:var(--text);background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid var(--border);
      transition:background .15s,border-color .15s,transform .12s;white-space:nowrap;}
    .cat-chip b{font-weight:700;color:var(--muted);font-size:12px;}
    .cat-chip:hover{background:rgba(79,124,240,.12);border-color:var(--accent);transform:translateY(-1px);}
    .cat-chip:active{transform:scale(.96);}
    #grid{max-width:1200px;margin:0 auto;padding:18px 18px 90px;}
    .cat-section{margin-bottom:28px;scroll-margin-top:120px;}
    .cat-section-h{font-size:17px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:10px;
      padding-bottom:8px;border-bottom:1px solid var(--border);}
    .cat-section-h span{font-size:12px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--text) 6%,transparent);
      padding:2px 9px;border-radius:20px;}
    .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .cat-select{min-width:170px;max-width:240px;cursor:pointer;}
    .cat-footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);}

    /* мобильный вид: 2 колонки, липкий поиск, компактная шапка */
    @media(max-width:560px){
      .cat-header{padding:22px 14px 12px;}
      .cat-header .badge-top{margin-bottom:12px;font-size:12px;padding:6px 14px;}
      .cat-header h1{font-size:clamp(26px,8vw,40px);}
      .cat-header p{font-size:13px;margin-top:10px;}
      .cat-controls{padding:8px 10px;}
      #grid{padding:12px 10px 110px;}
      .cat-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
      .cat-section{margin-bottom:20px;scroll-margin-top:100px;}
      .cat-section-h{font-size:15px;}
      .cat-chip{padding:5px 10px;font-size:12px;}
      .cat-nav{gap:6px;}
      .prod .body{padding:8px;gap:3px;}
      .prod .nm{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
      .prod .cat{font-size:11px;}
      .prod .badge{font-size:11px;padding:3px 8px;}
    }
    html[data-theme="light"] .cat-controls{background:rgba(255,255,255,.92);}
  </style>
</head>
<body>
  <header class="cat-header">
    <div class="badge-top">Актуальный ассортимент</div>
    <h1>Каталог <span>товаров</span></h1>
    <p>Выбирайте товары — статус наличия обновляется автоматически. По вопросам заказа свяжитесь с нами.</p>
  </header>
  <div class="cat-controls">
    <div class="cat-actions">
      <input id="search" class="inp cat-search" placeholder="Поиск по названию или артикулу…" />
      <select id="catSelect" class="inp cat-select"></select>
      <button id="pdfBtn" class="btn btn-primary" style="display:none">📄 Скачать каталог (PDF)</button>
    </div>
  </div>
  <main id="grid" class="cat-wrap">
    <div class="empty" style="grid-column:1/-1">
      <svg width="108" height="108" viewBox="0 0 512 512" style="margin-bottom:10px" role="img" aria-label="GENERAL MODERN">
        <defs>
          <linearGradient id="cst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f2f4f9"/><stop offset="1" stop-color="#dfe4ee"/></linearGradient>
          <linearGradient id="czl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e9a6"/><stop offset=".42" stop-color="#e3c163"/><stop offset=".74" stop-color="#c79a33"/><stop offset="1" stop-color="#a87b1f"/></linearGradient>
          <linearGradient id="cbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset=".55" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <clipPath id="cpl"><rect width="512" height="512" rx="112"/></clipPath>
          <style>
            @keyframes cpop{0%{transform:scale(.6);opacity:0}62%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
            @keyframes cturn{100%{transform:rotate(360deg)}}
            @keyframes clet{0%{opacity:0;transform:translateY(20px) scale(.9)}100%{opacity:1;transform:none}}
            @keyframes csweep{0%{transform:translateX(-560px) rotate(16deg)}100%{transform:translateX(560px) rotate(16deg)}}
            #cznak{animation:cpop .62s cubic-bezier(.2,.85,.25,1) both;transform-box:fill-box;transform-origin:center}
            #cring{animation:cturn 2.6s linear infinite;transform-box:fill-box;transform-origin:center}
            #cgm{animation:clet .55s ease .4s both;transform-box:fill-box;transform-origin:center}
            #cshine{animation:csweep 2.6s ease-in-out 1.2s infinite}
            @media (prefers-reduced-motion:reduce){#cznak,#cring,#cgm,#cshine{animation:none}}
          </style>
        </defs>
        <g id="cznak">
          <rect width="512" height="512" rx="112" fill="url(#cst)"/>
          <g clip-path="url(#cpl)"><path d="M-120 300 L300 -120 L430 10 L10 430 Z" fill="url(#cbl)"/></g>
          <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#c8cedd" stroke-width="5"/>
          <g id="cring" fill="none" stroke="url(#czl)" stroke-width="14" stroke-linecap="round">
            <path d="M256 74a182 182 0 0 1 182 182"/>
            <path d="M256 438A182 182 0 0 1 74 256"/>
          </g>
          <text id="cgm" x="256" y="314" text-anchor="middle" font-family="Inter, &apos;Segoe UI&apos;, system-ui, sans-serif" font-size="166" font-weight="800" letter-spacing="-8" fill="#16203a">GM</text>
          <g clip-path="url(#cpl)"><rect id="cshine" x="226" y="-130" width="72" height="772" fill="url(#cbl)" opacity=".55"/></g>
        </g>
      </svg>
      <p>Загрузка каталога…</p>
    </div>
  </main>
  <footer class="cat-footer">© 2026 · Каталог товаров</footer>

  <script src="config.js?v=20261030a"></script>
  <script type="module" src="js/catalog.js?v=20261030a"></script>
</body>
</html>
