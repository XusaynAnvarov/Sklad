name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SUPABASE_SERVICE_KEY
          script: |
            echo "=== SUPABASE_SERVICE_KEY setup ==="
            if [ -z "$SUPABASE_SERVICE_KEY" ]; then
              echo "ВНИМАНИЕ: секрет SUPABASE_SERVICE_KEY пуст — добавьте его в GitHub Secrets и перезапустите."
            else
              echo "Секрет получен (длина ${#SUPABASE_SERVICE_KEY})"
              ENVFILE="$(grep -rl '^SUPABASE_SERVICE_KEY=' /root /var/www /home /opt /srv /app 2>/dev/null | grep -v node_modules | head -1)"
              if [ -z "$ENVFILE" ]; then
                SRV="$(find / -name server.js 2>/dev/null | grep -v node_modules | head -1)"
                [ -n "$SRV" ] && ENVFILE="$(dirname "$SRV")/.env"
              fi
              if [ -z "$ENVFILE" ]; then
                echo "ОШИБКА: не нашёл .env / server.js на сервере"
              else
                touch "$ENVFILE"
                sed -i '/^SUPABASE_SERVICE_KEY=/d' "$ENVFILE"
                echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> "$ENVFILE"
                echo "Записано в: $ENVFILE"
                echo "--- ключи .env (значения скрыты) ---"
                sed 's/=.*/=***/' "$ENVFILE"
                echo "------------------------------------"
              fi
            fi
            echo "=== run deploy.sh ==="
            sh /root/deploy.sh
